<header class="doc-header" id="doc-header">
  <button type="button" class="icon-button nav-toggle" id="sidebar-open" aria-controls="sidebar-panel" aria-expanded="false" aria-label="Open navigation menu">
    <span class="icon-button-bar" aria-hidden="true"></span>
    <span class="icon-button-bar" aria-hidden="true"></span>
    <span class="icon-button-bar" aria-hidden="true"></span>
  </button>
  
  <div class="doc-header-title">
    {% if all_sites | length > 1 %}
    <div class="site-popover-container" id="site-popover-container">
      <button type="button" class="doc-header-site with-popover" id="site-popover-button" aria-haspopup="true" aria-expanded="false">
        {{ site.title }}
        <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="site-popover-menu" id="site-popover-menu" hidden>
        {% for s in all_sites %}
        <a href="{{ s.url }}" class="site-popover-item {% if s.mount == site.mount %}is-active{% endif %}">
          {{ s.title }}
          {% if s.mount == site.mount %}
          <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          {% endif %}
        </a>
        {% endfor %}
      </div>
    </div>
    {% else %}
    <a class="doc-header-site" href="{{ site.root_url }}">{{ site.title }}</a>
    {% endif %}
    <span class="doc-header-page">{{ page.title }}</span>
  </div>

  <div class="doc-header-actions">
    <button type="button" class="icon-button toc-toggle" id="toc-open" aria-controls="toc-panel" aria-expanded="false" aria-label="On this page"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg></button>
    <button type="button" class="icon-button theme-toggle" id="theme-toggle" aria-label="Toggle color theme">
      <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
</header>
