<button type="button" class="search-trigger" id="search-open" aria-haspopup="dialog" aria-controls="search-dialog" aria-label="Search">
  <svg class="search-trigger-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <span class="search-trigger-label">Search</span>
  <kbd class="search-trigger-key" aria-hidden="true">/</kbd>
</button>
<dialog class="search-dialog" id="search-dialog" aria-label="Search">
  <form class="search-dialog-form" action="/__search" method="get" role="search">
    <svg class="search-dialog-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input
      class="search-dialog-input"
      id="search-input"
      type="search"
      name="q"
      placeholder="Search pages"
      autocomplete="off"
      spellcheck="false"
      enterkeyhint="search"
      role="combobox"
      aria-expanded="false"
      aria-controls="search-results"
      aria-autocomplete="list"
    >
    <button type="button" class="search-dialog-close" id="search-close" aria-label="Close search"><kbd>Esc</kbd></button>
  </form>
  <ul class="search-results" id="search-results" role="listbox" aria-label="Results"></ul>
  <p class="search-dialog-hint" id="search-hint">Search by words or by meaning — “how do we handle incidents” works too.</p>
  <p class="search-dialog-status" id="search-status" role="status" aria-live="polite"></p>
  <footer class="search-dialog-footer">
    <a class="search-dialog-all" id="search-all" href="/__search">All results</a>
    <span class="search-dialog-keys" aria-hidden="true"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>↵</kbd> open</span>
  </footer>
</dialog>
<script src="/__assets/js/search.js" defer></script>
