<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}mdshelf{% endblock %}</title>
  <link rel="preload" href="/__assets/vendor/inter/files/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/__assets/vendor/inter/files/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/__assets/vendor/inter/files/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/__assets/vendor/inter/files/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/__assets/vendor/inter/files/inter-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/__assets/vendor/inter/inter.css">
  <link rel="stylesheet" href="/__mdshelf/syntax.css">
  <link rel="stylesheet" href="/__assets/css/main.css">
  <link rel="stylesheet" href="/__assets/css/syntax.css">
  <link rel="stylesheet" href="/__assets/vendor/katex/katex.min.css">
  <script defer src="/__assets/vendor/katex/katex.min.js"></script>
  <script>
    (function() {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem("mdshelf-theme");
        if (theme === "dark" || theme === "light") root.setAttribute("data-theme", theme);
        if (localStorage.getItem("mdshelf-toc-hidden") === "true") root.classList.add("toc-hidden");
        var sidebarW = localStorage.getItem("mdshelf-sidebar-w");
        if (sidebarW) root.style.setProperty("--sidebar-w", sidebarW);
        root.classList.add("sidebar-loading");
      } catch(e) {}
    })();
  </script>
  <script src="/__assets/js/ui.js" defer></script>
  <script src="/__assets/vendor/mermaid/mermaid.min.js" defer></script>
  <script src="/__assets/js/mermaid-viewer.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof katex === "undefined") return;
      document.querySelectorAll("[data-math-style='inline']").forEach(el => {
        katex.render(el.textContent, el, { throwOnError: false, displayMode: false });
      });
      document.querySelectorAll("[data-math-style='display']").forEach(el => {
        katex.render(el.textContent, el, { throwOnError: false, displayMode: true });
      });
    });
  </script>
  <script defer>
    function resolveMermaidTheme() {
      const attr = document.documentElement.getAttribute('data-theme');
      if (attr === 'dark') return 'dark';
      if (attr === 'light') return 'default';
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default';
    }

    async function renderMermaid() {
      if (typeof mermaid === 'undefined') return;
      const diagrams = document.querySelectorAll('.mermaid');
      if (!diagrams.length) return;

      diagrams.forEach(el => {
        el.removeAttribute('data-processed');
        el.innerHTML = el.textContent;
      });

      mermaid.initialize({ startOnLoad: false, theme: resolveMermaidTheme() });
      await mermaid.run({ nodes: diagrams });

      diagrams.forEach(el => window.mermaidViewerDecorate?.(el));
    }

    document.addEventListener('DOMContentLoaded', renderMermaid);

    const themeObserver = new MutationObserver(() => renderMermaid());
    themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (!document.documentElement.hasAttribute('data-theme')) renderMermaid();
    });
  </script>
  {% if site %}
  <style>
    :root {
      --accent: {{ site.color }};
      --accent-hover: color-mix(in srgb, {{ site.color }} 80%, var(--mix-blend-dark, black));
      --accent-soft: color-mix(in srgb, {{ site.color }} 15%, transparent);
    }
    :root[data-theme="dark"] {
      --accent: {{ site.color }};
      --accent-hover: color-mix(in srgb, {{ site.color }} 80%, var(--mix-blend-dark, white));
      --accent-soft: color-mix(in srgb, {{ site.color }} 15%, transparent);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --accent: {{ site.color }};
        --accent-hover: color-mix(in srgb, {{ site.color }} 80%, var(--mix-blend-dark, white));
        --accent-soft: color-mix(in srgb, {{ site.color }} 15%, transparent);
      }
    }
  </style>
  {% endif %}
</head>
<body class="mdshelf-body">
{% block body %}{% endblock %}
</body>
</html>
