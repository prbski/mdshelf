[package]
name = "mdshelf"
version = "1.0.8"
edition = "2024"
description = "A Rust web server that serves folders of markdown files as websites."
repository = "https://github.com/prbski/mdshelf"
homepage = "https://github.com/prbski/mdshelf"
authors = ["Patryk Porebski"]
license = "MIT OR Apache-2.0"

[package.metadata.wix]
upgrade-guid = "E0FECC91-3163-4ADC-AD0D-02369DE1ED29"
path-guid = "89516A63-5295-4A2F-99C4-8F68F288AD92"
license = false
eula = false

[lib]
name = "mdshelf"
path = "src/lib.rs"

[[bin]]
name = "mdshelf"
path = "src/main.rs"

[features]
# Exposes the mock OIDC issuer and server harness to the integration suite.
test-support = ["dep:tempfile"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.1", features = ["derive"] }
comrak = { version = "0.52.0", default-features = false, features = [
  "syntect",
] }
cookie = "0.18.2"
futures = "0.3.32"
futures-util = "0.3.32"
gray_matter = "0.3.2"
include_dir = "0.7.4"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
minijinja = "2.19.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
service-manager = "0.11.0"
sha2 = "0.11.0"
shellexpand = "3.1.2"
syntect = "5.3.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-stream = "0.1.18"
toml = "1.1.2"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = [
  "fs",
  "compression-gzip",
  "compression-br",
  "trace",
  "set-header",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
walkdir = "2.5.0"
# Only built for the test-support feature; see [features].
tempfile = { version = "3.27.0", optional = true }
rustls-acme = { version = "0.15.4", default-features = false, features = ["tokio", "ring", "axum", "webpki-roots", "tls12"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
walkdir = "2.5.0"
