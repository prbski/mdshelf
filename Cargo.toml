[package]
name = "mdshelf"
version = "1.0.0"
edition = "2024"
description = "A Rust web server that serves folders of markdown files as websites."
repository = "https://github.com/prbski/mdshelf"
homepage = "https://github.com/prbski/mdshelf"
authors = ["Patryk Porebski"]
license = "MIT OR Apache-2.0"

[package.metadata.wix]
upgrade-guid = "E0FECC91-3163-4ADC-AD0D-02369DE1ED29"
path-guid = "89516A63-5295-4A2F-99C4-8F68F288AD92"
license = false
eula = false

[[bin]]
name = "mdshelf"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros", "ws"] }
clap = { version = "4.6.1", features = ["derive"] }
comrak = { version = "0.52.0", default-features = false, features = [
  "syntect",
] }
futures = "0.3.32"
futures-util = "0.3.32"
gray_matter = "0.3.2"
include_dir = "0.7.4"
minijinja = "2.19.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
service-manager = "0.11.0"
shellexpand = "3.1.2"
syntect = "5.3.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-stream = "0.1.18"
toml = "1.1.2"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = [
  "fs",
  "compression-gzip",
  "compression-br",
  "trace",
  "set-header",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
